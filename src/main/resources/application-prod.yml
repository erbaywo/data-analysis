# 生产环境配置
server:
  port: 9080

spring:
  application:
    name: oa-system
  
  # 数据库配置 - 使用环境变量
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:oa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境使用 validate
    show-sql: false  # 生产环境关闭 SQL 日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.yc.analysis: INFO
  file:
    name: /app/logs/oa-system.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Swagger 配置
springdoc:
  packages-to-scan: org.yc.oa.controller
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 抖音配置 - 使用环境变量
douyin:
  client-id: ${DOUYIN_CLIENT_ID}
  client-secret: ${DOUYIN_CLIENT_SECRET}
  redirect-uri: ${DOUYIN_REDIRECT_URI}

# 飞书配置 - 使用环境变量
feishu:
  app-id: ${FEISHU_APP_ID}
  app-secret: ${FEISHU_APP_SECRET}
  app-token: ${FEISHU_APP_TOKEN}
  account-table-id: ${FEISHU_ACCOUNT_TABLE_ID}
  video-table-id: ${FEISHU_VIDEO_TABLE_ID}
  base-url: https://open.feishu.cn
  redirect-uri: ${FEISHU_REDIRECT_URI}
