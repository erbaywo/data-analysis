<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信视频号数据上传助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .init-btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }

        .init-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.4);
        }

        .dashboard-link {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .dashboard-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            text-decoration: none;
            color: white;
        }

        .tab-container {
            margin-bottom: 30px;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #e1e5e9;
            margin-bottom: 30px;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
            background-color: #f8f9ff;
        }

        .tab-content {
            display: none;
            padding: 25px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            background: #fafbfc;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-label {
            display: block;
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #6c757d;
        }

        .file-label:hover {
            background: #e9ecef;
            border-color: #667eea;
            color: #667eea;
        }

        .file-label.has-file {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .upload-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .success-message, .error-message {
            display: none;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .init-btn, .dashboard-link {
                display: block;
                margin: 5px 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>微信视频号数据上传助手</h1>
        <p>请选择要上传的数据类型，并上传对应的CSV文件</p>
        <div>
            <button class="init-btn" onclick="initializeTables()">
                🔧 初始化数据库表
            </button>
            <a href="https://ocn8o3ghsdb2.feishu.cn/share/base/dashboard/shrcnFWLAZb1airEoMfjGY0KCMe"
               target="_blank" class="dashboard-link">
                📈 查看数据分析看板
            </a>
        </div>
    </div>

    <div class="tab-container">
        <div class="tab-buttons">
            <button class="tab-button active" id="accountTab">📊 账号数据上传</button>
            <button class="tab-button" id="videoTab">🎬 视频数据上传</button>
        </div>

        <div class="tab-content active" id="accountContent">
            <div class="section-title">📊 上传账号数据</div>
            <form id="accountForm">
                <div class="form-group">
                    <label class="form-label" for="accountDate">数据统计日期</label>
                    <input type="date" id="accountDate" name="date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">选择CSV文件</label>
                    <div class="file-upload">
                        <input type="file" id="accountFile" name="file" class="file-input" accept=".csv" required>
                        <label for="accountFile" class="file-label" id="accountLabel">
                            📁 点击选择账号数据CSV文件
                        </label>
                    </div>
                </div>
                <button type="submit" class="upload-btn" id="uploadAccountBtn" disabled>
                    上传账号数据
                </button>
                <div class="progress-bar" id="accountProgress">
                    <div class="progress-fill" id="accountProgressFill"></div>
                </div>
            </form>
        </div>

        <div class="tab-content" id="videoContent">
            <div class="section-title">🎬 上传视频数据</div>
            <form id="videoForm">
                <div class="form-group">
                    <label class="form-label">选择CSV文件</label>
                    <div class="file-upload">
                        <input type="file" id="videoFile" name="file" class="file-input" accept=".csv" required>
                        <label for="videoFile" class="file-label" id="videoLabel">
                            📁 点击选择视频数据CSV文件
                        </label>
                    </div>
                </div>
                <button type="submit" class="upload-btn" id="uploadVideoBtn" disabled>
                    上传视频数据
                </button>
                <div class="progress-bar" id="videoProgress">
                    <div class="progress-fill" id="videoProgressFill"></div>
                </div>
            </form>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <h3>🎉 数据上传完成！</h3>
        <p id="successText">您的数据已成功上传，现在可以查看数据分析看板了。</p>
        <a href="https://ocn8o3ghsdb2.feishu.cn/share/base/dashboard/shrcnFWLAZb1airEoMfjGY0KCMe"
           target="_blank" class="dashboard-link">
            📈 打开微信视频号数据分析看板
        </a>
    </div>

    <div class="error-message" id="errorMessage">
        <h3>❌ 操作失败</h3>
        <p id="errorText">请稍后重试或检查文件格式。</p>
    </div>
</div>

<script>
    const API_BASE = '';  // 当前域名下的API

    // 显示消息
    function showMessage(type, text) {
        const successMsg = document.getElementById('successMessage');
        const errorMsg = document.getElementById('errorMessage');

        successMsg.style.display = 'none';
        errorMsg.style.display = 'none';

        if (type === 'success') {
            document.getElementById('successText').textContent = text;
            successMsg.style.display = 'block';
            successMsg.scrollIntoView({ behavior: 'smooth' });
        } else {
            document.getElementById('errorText').textContent = text;
            errorMsg.style.display = 'block';
            errorMsg.scrollIntoView({ behavior: 'smooth' });
        }
    }

    // 显示进度条
    function showProgress(progressBarId, show = true) {
        const progressBar = document.getElementById(progressBarId);
        const progressFill = document.getElementById(progressBarId + 'Fill');

        if (show) {
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            // 模拟进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressFill.style.width = progress + '%';
                if (progress >= 90) {
                    clearInterval(interval);
                }
            }, 100);

            return interval;
        } else {
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
        }
    }

    // 完成进度条
    function completeProgress(progressBarId, interval) {
        const progressFill = document.getElementById(progressBarId + 'Fill');
        clearInterval(interval);
        progressFill.style.width = '100%';

        setTimeout(() => {
            showProgress(progressBarId, false);
        }, 500);
    }

    // 初始化数据库表
    async function initializeTables() {
        const btn = event.target;
        const originalText = btn.textContent;

        btn.disabled = true;
        btn.textContent = '初始化中...';

        try {
            const response = await fetch('/api/admin/init-tables', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const result = await response.json();

            if (response.ok) {
                showMessage('success', '数据库表初始化成功！');
                btn.textContent = '✅ 初始化完成';
                btn.style.background = '#28a745';
            } else {
                throw new Error(result.message || '初始化失败');
            }
        } catch (error) {
            console.error('初始化失败:', error);
            showMessage('error', '初始化失败: ' + error.message);
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }

    // 上传文件
    async function uploadFile(url, formData, progressBarId, button) {
        const interval = showProgress(progressBarId);

        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });

            completeProgress(progressBarId, interval);

            const result = await response.json();

            if (response.ok) {
                button.textContent = '✅ 上传完成';
                button.style.background = '#28a745';
                showMessage('success', '文件上传成功！数据已保存到数据库。');
            } else {
                throw new Error(result.message || '上传失败');
            }
        } catch (error) {
            completeProgress(progressBarId, interval);
            console.error('上传失败:', error);
            showMessage('error', '上传失败: ' + error.message);
            button.textContent = button.textContent.replace('上传中...', '重新上传');
            button.disabled = false;
        }
    }

    // 处理账号数据上传
    document.getElementById('accountForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const button = document.getElementById('uploadAccountBtn');
        const formData = new FormData(this);

        button.disabled = true;
        button.textContent = '上传中...';

        await uploadFile('/api/upload/account', formData, 'accountProgress', button);
    });

    // 处理视频数据上传
    document.getElementById('videoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const button = document.getElementById('uploadVideoBtn');
        const formData = new FormData(this);

        button.disabled = true;
        button.textContent = '上传中...';

        await uploadFile('/api/upload/video', formData, 'videoProgress', button);
    });

    // 文件选择处理
    function handleFileSelect(fileInputId, labelId, uploadBtnId) {
        const fileInput = document.getElementById(fileInputId);
        const label = document.getElementById(labelId);
        const uploadBtn = document.getElementById(uploadBtnId);

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                label.textContent = `✅ 已选择: ${file.name}`;
                label.classList.add('has-file');

                // 检查账号数据是否需要日期
                if (fileInputId === 'accountFile') {
                    const dateInput = document.getElementById('accountDate');
                    uploadBtn.disabled = !dateInput.value;
                } else {
                    uploadBtn.disabled = false;
                }
            } else {
                label.textContent = fileInputId === 'accountFile' ?
                    '📁 点击选择账号数据CSV文件' : '📁 点击选择视频数据CSV文件';
                label.classList.remove('has-file');
                uploadBtn.disabled = true;
            }
        });
    }

    // 日期选择处理
    document.getElementById('accountDate').addEventListener('change', function() {
        const fileInput = document.getElementById('accountFile');
        const uploadBtn = document.getElementById('uploadAccountBtn');
        uploadBtn.disabled = !(this.value && fileInput.files[0]);
    });

    // 选项卡切换
    function switchTab(tabName) {
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        document.getElementById(`${tabName}Tab`).classList.add('active');
        document.getElementById(`${tabName}Content`).classList.add('active');
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        handleFileSelect('accountFile', 'accountLabel', 'uploadAccountBtn');
        handleFileSelect('videoFile', 'videoLabel', 'uploadVideoBtn');

        // 选项卡切换事件
        document.getElementById('accountTab').addEventListener('click', () => switchTab('account'));
        document.getElementById('videoTab').addEventListener('click', () => switchTab('video'));

        // 设置默认日期为今天
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('accountDate').value = today;
    });
</script>
</body>
</html>
